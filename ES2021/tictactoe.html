<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>틱택토</title>

    <style>
      table {
        border-collapse: collapse;
      }

      td {
        border: 1px solid black;
        width: 40px;
        height: 40px;
        text-align: center;
      }
      div {
        width: 120px;
        text-align: center;
        background-color: cadetblue;
        color: white;
        font-size: 16px;
        font-weight: 700;
        padding: 5px 0;
      }
      div:empty {
        display: none;
      }
      button {
        width: 80px;
        margin: 10px 20px;
      }
    </style>
  </head>
  <body>
    <script>
      let row = 3;
      let turn = ["O", "X"];
      let turnCount = 0;
      let isEnd = false;
      const data = [];
      const $table = document.createElement("table");
      const $reuslt = document.createElement("div");
      const $button = document.createElement("button");
      document.body.append($table);
      document.body.append($button);
      document.body.append($reuslt);

      for (let i = 0; i < row; i++) {
        const $tr = document.createElement("tr");
        const cells = [];
        $table.append($tr);
        for (let j = 0; j < row; j++) {
          const $td = document.createElement("td");
          cells.push($td);
          $td.addEventListener("click", (e) => {
            if (isEnd) return;
            if (e.target.textContent) return;

            turnCount++;
            e.target.textContent = turn[(turnCount - 1) % 2];

            console.log(turnCount);
            setTimeout(() => {
              if (checkBingo()) {
                isEnd = true;
                $reuslt.textContent = `${turn[(turnCount - 1) % 2]} 승리`;
              } else if (turnCount == row ** 2) {
                $reuslt.textContent = "무승부";
              }
            }, 0);
          });
          $tr.append($td);
        }
        data.push(cells);
      }
      console.log(data);

      function checkBingo() {
        // 행
        for (let i = 0; i < row; i++) {
          const first = data[i][0].textContent;
          if (first && data[i].every((v) => v.textContent === first)) {
            return true;
          }
        }

        // 열
        for (let i = 0; i < row; i++) {
          const first = data[0][i].textContent;
          if (first && data.every((r) => r[i].textContent === first)) {
            return true;
          }
        }

        // 대각선 ↙
        first = data[0][row - 1].textContent;
        if (
          first &&
          data.every((r, i) => r[row - 1 - i].textContent === first)
        ) {
          return true;
        }

        // 대각선 ↘
        first = data[0][0].textContent;
        if (first && data.every((r, i) => r[i].textContent === first)) {
          return true;
        }

        return false;
      }

      $button.textContent = "다시 하기";
      $button.addEventListener("click", reset);

      function reset() {
        turnCount = 0;
        isEnd = false;
        $reuslt.textContent = "";
        data.forEach((dataRow) => {
          dataRow.forEach((dataCell) => {
            dataCell.textContent = "";
          });
        });
      }
    </script>
  </body>
</html>

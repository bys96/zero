<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>카드 짝맞추기</title>

    <style>
      #wrapper {
        width: 400px;
      }

      .card {
        display: inline-block;
        margin-right: 20px;
        margin-bottom: 20px;
        width: 70px;
        height: 100px;
        perspective: 140px;
      }

      .card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        text-align: center;
        transition: transform 0.8s;
        transform-style: preserve-3d;
        cursor: pointer;
      }

      .card.flipped .card-inner {
        transform: rotateY(180deg);
      }

      .card-front {
        background-color: navy;
      }

      .card-front,
      .card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 1px solid black;
        backface-visibility: hidden;
      }

      .card-back {
        transform: rotateY(180deg);
      }

      .time-log {
        text-align: center;
        width: 340px;
      }
    </style>
  </head>
  <body>
    <div id="wrapper"></div>

    <script>
      const $wrapper = document.querySelector("#wrapper");
      const $timeLog = document.createElement("div");

      const total = 12;
      const colors = ["red", "orange", "yellow", "green", "beige", "pink"];
      let colorCopy = colors.concat(colors);
      let shuffled = [];
      let cardArr = [];
      let clickable = false;
      let startTime;

      const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      const shuffle = () => {
        while (colorCopy.length > 0) {
          const randomIndex = Math.floor(Math.random() * colorCopy.length);
          const spliced = colorCopy.splice(randomIndex, 1);
          shuffled = shuffled.concat(spliced);
        }
      };

      const createCard = (i) => {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.color = shuffled[i];
        const cardInner = document.createElement("div");
        cardInner.className = "card-inner";
        const cardFront = document.createElement("div");
        cardFront.className = "card-front";
        const cardBack = document.createElement("div");
        cardBack.className = "card-back";
        cardBack.style.backgroundColor = shuffled[i];
        cardInner.appendChild(cardFront);
        cardInner.appendChild(cardBack);
        card.appendChild(cardInner);
        return card;
      };

      const allCardFlip = async () => {
        const $cardAll = document.querySelectorAll(".card");

        for (const c of $cardAll) {
          c.classList.add("flipped");
        }

        await delay(3000); // 3초공개

        for (const c of $cardAll) {
          c.classList.remove("flipped");
        }
        await delay(500);

        clickable = true;
        startTime = new Date();
      };

      const startGame = async () => {
        shuffle();
        for (let i = 0; i < total; i++) {
          const card = createCard(i);
          $wrapper.appendChild(card);
        }

        $timeLog.className = "time-log";
        $wrapper.appendChild($timeLog);

        await delay(500);
        allCardFlip();
      };

      function checkColor() {
        let c1 = cardArr[0];
        let c2 = cardArr[1];

        if (c1.dataset.color != c2.dataset.color) {
          c1.classList.remove("flipped");
          c2.classList.remove("flipped");
        }
        cardArr = [];
      }

      function isFinished() {
        const $cardAll = document.querySelectorAll(".card");
        return [...$cardAll].every((v) => v.classList.contains("flipped"));
      }

      startGame();

      $wrapper.addEventListener("click", async (e) => {
        const front = e.target.closest(".card-front");
        if (!clickable) return;
        if (!front) return;
        if (cardArr.length == 2) return;

        const c = front.closest(".card");

        if (cardArr.includes(c)) return;

        c.classList.toggle("flipped");
        cardArr.push(c);

        if (cardArr.length == 2) {
          await delay(500);
          checkColor();
          if (isFinished()) {
            let endTime = new Date();
            $timeLog.textContent = `${(endTime - startTime) / 1000}초`;
          }
        }
      });
    </script>
  </body>
</html>

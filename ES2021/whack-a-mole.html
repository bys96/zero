<html>
  <head>
    <meta charset="UTF-8" />
    <title>두더지 잡기</title>
    <style>
      #game {
        user-select: none;
      }
      #life {
        font-size: 25px;
        margin-bottom: 10px;
      }
      .cell {
        display: inline-block;
        position: relative;
        width: 200px;
        height: 200px;
        background: "yellow";
        overflow: hidden;
      }
      .gopher,
      .bomb {
        width: 200px;
        height: 200px;
        bottom: 0;
        position: absolute;
        transition: bottom 1s;
      }
      .gopher {
        background: url("./images/gopher.png") center center no-repeat;
        background-size: 200px 200px;
      }
      .dead {
        background: url("./images/dead_gopher.png") center center no-repeat;
        background-size: 200px 200px;
      }
      .bomb {
        background: url("./images/bomb.png") center center no-repeat;
        background-size: 200px 200px;
      }
      .boom {
        background: url("./images/explode.png") center center no-repeat;
        background-size: 200px 200px;
      }
      .hidden {
        bottom: -200px;
      }
      .hole {
        width: 200px;
        height: 150px;
        position: absolute;
        bottom: 0;
        background: url("./images/mole-hole.png") center center no-repeat;
        background-size: 200px 150px;
      }
      .hole-front {
        width: 200px;
        height: 30px;
        position: absolute;
        bottom: 0;
        background: url("./images/mole-hole-front.png") center center no-repeat;
        background-size: 200px 30px;
      }
    </style>
  </head>
  <body>
    <div>
      <div id="life">목숨</div>
      <span id="timer">시간</span>초&nbsp; <span id="score">0</span>점
      <button id="start">시작</button>
    </div>
    <div id="game">
      <div class="row">
        <div class="cell">
          <div class="hole"></div>
          <div class="gopher hidden"></div>
          <div class="bomb hidden"></div>
          <div class="hole-front"></div>
        </div>
        <div class="cell">
          <div class="hole"></div>
          <div class="gopher hidden"></div>
          <div class="bomb hidden"></div>
          <div class="hole-front"></div>
        </div>
        <div class="cell">
          <div class="hole"></div>
          <div class="gopher hidden"></div>
          <div class="bomb hidden"></div>
          <div class="hole-front"></div>
        </div>
      </div>
      <div class="row">
        <div class="cell">
          <div class="hole"></div>
          <div class="gopher hidden"></div>
          <div class="bomb hidden"></div>
          <div class="hole-front"></div>
        </div>
        <div class="cell">
          <div class="hole"></div>
          <div class="gopher hidden"></div>
          <div class="bomb hidden"></div>
          <div class="hole-front"></div>
        </div>
        <div class="cell">
          <div class="hole"></div>
          <div class="gopher hidden"></div>
          <div class="bomb hidden"></div>
          <div class="hole-front"></div>
        </div>
      </div>
      <div class="row">
        <div class="cell">
          <div class="hole"></div>
          <div class="gopher hidden"></div>
          <div class="bomb hidden"></div>
          <div class="hole-front"></div>
        </div>
        <div class="cell">
          <div class="hole"></div>
          <div class="gopher hidden"></div>
          <div class="bomb hidden"></div>
          <div class="hole-front"></div>
        </div>
        <div class="cell">
          <div class="hole"></div>
          <div class="gopher hidden"></div>
          <div class="bomb hidden"></div>
          <div class="hole-front"></div>
        </div>
      </div>
    </div>
    <script>
      const $life = document.querySelector("#life");
      const $timer = document.querySelector("#timer");
      const $score = document.querySelector("#score");
      const $game = document.querySelector("#game");
      const $start = document.querySelector("#start");
      const $$cells = document.querySelectorAll(".cell");

      const holes = [0, 0, 0, 0, 0, 0, 0, 0, 0];
      let started = false;
      let isGameEnd = false;
      let life = 3;
      let score = 0;
      let time = 30;
      let tickInterval;
      let timerInterval;

      let gopherPercent = 0.3;
      let bombPercent = 0.5;

      function tick() {
        $$cells.forEach(($cell, idx) => {
          let $gopher = $cell.querySelector(".gopher");
          let $bomb = $cell.querySelector(".bomb");

          if (holes[idx]) return;

          holes[idx] = setTimeout(() => {
            let randomNum = Math.random();
            if (randomNum < gopherPercent) {
              $gopher.classList.remove("hidden");
              setTimeout(() => {
                $gopher.classList.add("hidden");
              }, 1000);
            } else if (randomNum < bombPercent) {
              $bomb.classList.remove("hidden");
              setTimeout(() => {
                $bomb.classList.add("hidden");
              }, 1000);
            }
            holes[idx] = 0;
          }, 1000);
        });
      }

      function timer() {
        timerInterval = setInterval(() => {
          time = (time * 10 - 1) / 10;

          $timer.textContent = Math.floor(time);

          if (time <= 0) {
            isGameEnd = true;
            clearInterval(timerInterval);
            clearInterval(tickInterval);
            $timer.textContent = 0;
            setTimeout(() => {
              alert(`시간종료, 점수는 ${score}점 입니다.`);
            }, 50);
          }
        }, 100);
      }

      function renderLifeScore() {
        let remainHeart = "❤️";
        let emptyHeart = "♡";
        let lifeHeart = remainHeart.repeat(life) + emptyHeart.repeat(3 - life);
        $life.textContent = lifeHeart;
        $score.textContent = score;
        $start.textContent = isGameEnd ? "재시작" : "시작";
      }

      function restart() {
        //혹시나 남아있을 인터벌 지우기
        clearInterval(timerInterval);
        clearInterval(tickInterval);

        started = false;
        isGameEnd = false;
        life = 3;
        score = 0;
        time = 30;
        $timer.textContent = time;
        renderLifeScore();
      }

      function gameStart() {
        if (started) return;
        started = true;
        timer();

        tickInterval = setInterval(tick, 1000);
      }

      ////////////////////////////////////////////////////
      $timer.textContent = time;

      renderLifeScore();

      $start.addEventListener("click", () => {
        if (isGameEnd) restart();
        else gameStart();
      });

      $$cells.forEach(($cell, i) => {
        $cell.addEventListener("click", (e) => {
          if (isGameEnd) return;

          let clicked = e.target;
          if (clicked.classList.contains("gopher")) {
            if (clicked.classList.contains("dead")) return;
            score++;
            clicked.classList.add("dead");
            clicked.classList.add("hidden");
            clearTimeout(holes[i]);
            setTimeout(() => {
              clicked.classList.remove("dead");
            }, 1000);
          } else if (clicked.classList.contains("bomb")) {
            if (clicked.classList.contains("boom")) return;
            life = Math.max(0, life - 1);
            clicked.classList.add("boom");
            clicked.classList.add("hidden");
            clearTimeout(holes[i]);
            setTimeout(() => {
              clicked.classList.remove("boom");
            }, 1000);
          }

          renderLifeScore();

          if (life == 0) {
            isGameEnd = true;
            clearInterval(timerInterval);
            clearInterval(tickInterval);
            setTimeout(() => {
              alert(`목숨소진, 점수는 ${score}점 입니다.`);
              renderLifeScore();
            }, 50);
          }
        });
      });
    </script>
  </body>
</html>
